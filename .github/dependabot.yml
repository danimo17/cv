version: 2
updates:
  - package-ecosystem: npm # covers pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    # Major updates arrive as individual PRs.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
