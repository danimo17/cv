name: preview
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `secrets.*` no es pot usar dins d'`if:`; es comprova via env en un pas.
      - name: Check Cloudflare secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set as repository secrets; skipping preview."
          fi

      - if: steps.cf.outputs.configured == 'true'
        uses: actions/checkout@v7
      - if: steps.cf.outputs.configured == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.cf.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.cf.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.cf.outputs.configured == 'true'
        run: pnpm build

      # Puja una versió sense desplegar-la. L'àlies `pr-<n>` dona una URL estable per PR
      # (pr-<n>-cv.<subdomini>.workers.dev) a més de la URL de versió.
      # `--message` porta número + sha, no el títol del PR: el títol és text d'usuari i aniria dins d'una ordre de shell.
      # `deployment-url` = `preview_url` de la versió pujada (wrangler-action llegeix el fitxer d'output de wrangler).
      - name: Upload preview version
        if: steps.cf.outputs.configured == 'true'
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }} --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}"

      - name: Comment preview URL on PR
        if: steps.cf.outputs.configured == 'true'
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_URL: ${{ steps.upload.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.upload.outputs.command-output }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- cv-preview -->'
            const out = process.env.COMMAND_OUTPUT || ''
            const urls = [...new Set(out.match(/https:\/\/[a-z0-9.-]+\.workers\.dev/g) || [])]
            const versionUrl = process.env.DEPLOYMENT_URL || urls[0] || ''
            const aliasUrl = urls.find((u) => u.startsWith('https://pr-')) || ''
            if (!versionUrl && !aliasUrl) {
              core.warning('No preview URL found in wrangler output.')
              return
            }
            const lines = [marker, '### Preview', '']
            if (aliasUrl) lines.push(`- Alias (stable for this PR): ${aliasUrl}`)
            if (versionUrl) lines.push(`- This version: ${versionUrl}`)
            lines.push('', `Commit \`${process.env.HEAD_SHA.slice(0, 7)}\`. Previews use the production Worker secrets.`)
            const body = lines.join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find((c) => c.body && c.body.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
            await core.summary.addRaw(body).write()
