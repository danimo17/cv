name: audit-fix
on:
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: audit-fix
  cancel-in-progress: false

jobs:
  audit-fix:
    name: audit-fix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the dedicated token
        env:
          AUDIT_FIX_TOKEN: ${{ secrets.AUDIT_FIX_TOKEN }}
        run: |
          if [ -z "$AUDIT_FIX_TOKEN" ]; then
            echo "::error::The repository secret AUDIT_FIX_TOKEN is missing. Create the fine-grained token described in decision 063 and add it under Settings, Secrets and variables, Actions."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUDIT_FIX_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Decide whether a fix is needed
        id: plan
        env:
          GH_TOKEN: ${{ secrets.AUDIT_FIX_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          default=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          if [ "$GITHUB_REF_NAME" != "$default" ]; then
            echo "::error::audit-fix only runs from the default branch ($default), not from $GITHUB_REF_NAME"
            exit 1
          fi
          echo "default=$default" >> "$GITHUB_OUTPUT"
          if pnpm audit --audit-level=high > "$RUNNER_TEMP/audit-before.txt" 2>&1; then
            echo "pnpm audit is clean, nothing to fix"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tail -n 3 "$RUNNER_TEMP/audit-before.txt"
          open=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("chore/audit-fix-"))] | length')
          if [ "$open" != "0" ]; then
            echo "an audit-fix pull request is already open, leaving it to the owner"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Apply the pnpm audit overrides
        id: fix
        if: steps.plan.outputs.run == 'true'
        run: |
          cp pnpm-workspace.yaml "$RUNNER_TEMP/workspace.orig"
          pnpm audit --fix=override 2>&1 | tee "$RUNNER_TEMP/fix.log"
          awk 'NR==FNR{orig[$0]=1;next} /^minimumReleaseAgeExclude:/{blk=1;print;next} blk&&/^[^ ]/{blk=0} blk&&!($0 in orig){next} {print}' "$RUNNER_TEMP/workspace.orig" pnpm-workspace.yaml > "$RUNNER_TEMP/workspace.new"
          mv "$RUNNER_TEMP/workspace.new" pnpm-workspace.yaml
      - name: Install with the new overrides
        id: install
        if: steps.plan.outputs.run == 'true'
        run: pnpm install --no-frozen-lockfile --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/install.log"
      - name: Re-run the audit
        id: verify
        if: steps.plan.outputs.run == 'true'
        run: pnpm audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/audit-after.txt"
      - name: Open the pull request
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUDIT_FIX_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE: ${{ steps.plan.outputs.default }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "the audit fix changed nothing, no pull request to open"
            exit 0
          fi
          day=$(date -u +%Y%m%d)
          branch="chore/audit-fix-$day"
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
            branch="$branch-$GITHUB_RUN_NUMBER"
          fi
          stamp="${branch#chore/audit-fix-}"
          decision=".claude/docs/decisions/audit-fix-$stamp.md"
          git diff -U0 -- pnpm-workspace.yaml | awk '/^\+  [^ -]/ { l = substr($0, 4); i = match(l, /: [^ ]+$/); k = substr(l, 1, i - 1); v = substr(l, i + 2); gsub(/\047/, "", k); gsub(/\047/, "", v); printf "- `%s` to `%s`\n", k, v }' > "$RUNNER_TEMP/overrides.md"
          {
            printf '# Audit auto-fix %s\n\n' "$stamp"
            printf 'Generated by `.github/workflows/audit-fix.yml` (run %s), see `.claude/docs/decisions/063-audit-autofix-workflow.md`. `pnpm audit --fix=override` added these overrides to `pnpm-workspace.yaml`; each one raises a vulnerable transitive dependency to its patched floor.\n\n' "$RUN_URL"
            cat "$RUNNER_TEMP/overrides.md"
            printf '\nREMOVE-WHEN for every override above: the parent dependency that pulls it ships a release whose own lockfile resolution is already at or above the floor; then the override is deleted and `pnpm audit --audit-level=high` is re-run.\n'
          } > "$decision"
          pnpm exec prettier --write pnpm-workspace.yaml "$decision"
          {
            printf '## Summary\n\n'
            printf 'The weekly audit-fix workflow ran `pnpm audit --fix=override` (%s), installed the result and confirmed that `pnpm audit --audit-level=high` passes. No advisory is ignored.\n\n' "$RUN_URL"
            printf '## Overrides added\n\n'
            cat "$RUNNER_TEMP/overrides.md"
            printf '\n`minimumReleaseAgeExclude` was restored to its previous content, so every patched version in the lockfile respects `minimumReleaseAge`.\n\n'
            printf '## Owner action\n\n'
            printf 'Review the overrides and the generated decision file, wait for the required checks and merge this pull request yourself. The workflow never merges.\n'
          } > "$RUNNER_TEMP/pr-body.md"
          git config user.name danimo17
          git config user.email daniel.spr17@gmail.com
          git checkout -b "$branch"
          git add -A
          git commit -m "fix(deps): auto-fix audit advisories"
          git push origin "$branch"
          gh pr create --base "$BASE" --head "$branch" --title "Auto-fix audit advisories $day" --body-file "$RUNNER_TEMP/pr-body.md"
      - name: Report the advisories left
        if: failure() && (steps.fix.outcome == 'failure' || steps.install.outcome == 'failure' || steps.verify.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='audit: advisories left after auto-fix'
          section() {
            if [ -s "$2" ]; then
              printf '## %s\n\n```\n' "$1"
              tail -c "$3" "$2"
              printf '\n```\n\n'
            fi
          }
          remaining="$RUNNER_TEMP/audit-after.txt"
          [ -s "$remaining" ] || remaining="$RUNNER_TEMP/audit-before.txt"
          {
            printf 'The weekly audit-fix run %s could not clear the high advisories of `pnpm audit --audit-level=high`. No ignore was written and no pull request was opened.\n\n' "$RUN_URL"
            printf 'Decide what to do: wait for a patched release, fix it by hand, or approve an ignore with a decision record.\n\n'
            section 'Overrides proposed by the audit fix' "$RUNNER_TEMP/fix.log" 6000
            section 'Install log' "$RUNNER_TEMP/install.log" 6000
            section 'Remaining advisories' "$remaining" 30000
          } > "$RUNNER_TEMP/issue.md"
          number=$(gh api "repos/$GH_REPO/issues?state=open&per_page=100" --jq ".[] | select(.pull_request == null and .title == \"$title\") | .number" | sed -n '1p')
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/$number" -F body=@"$RUNNER_TEMP/issue.md"
          else
            gh api "repos/$GH_REPO/issues" -f title="$title" -F body=@"$RUNNER_TEMP/issue.md"
          fi
